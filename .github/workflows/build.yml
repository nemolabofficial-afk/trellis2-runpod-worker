name: Build and publish worker image

# Builds on every push to main and publishes to GitHub Container Registry
# (ghcr.io). RunPod pulls from there directly — no separate Docker Hub
# account needed, and GHCR is free for public repos.
on:
  push:
    branches: [main]
  workflow_dispatch: {}  # allows manually re-triggering a build from the
                          # GitHub Actions UI without pushing a new commit

env:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # required to push to ghcr.io under this repo

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive  # TRELLIS.2 itself is cloned inside the
                                  # Dockerfile via git clone --recursive, so
                                  # this repo's own submodules (if any are
                                  # added later) are still handled correctly

      # The image bundles a CUDA devel toolchain, a conda env and ~8 GB of
      # weights; the standard runner's ~14 GB free disk is not enough.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          # RunPod workers run on x86_64 Linux GPU hosts. Building for
          # linux/amd64 explicitly avoids a mismatch if this ever runs on an
          # ARM CI runner.
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          # A commit-SHA tag alongside :latest lets you pin a known-good
          # build in RunPod's console once you've validated it, rather than
          # being at the mercy of whatever the next push happens to contain
          # — the exact risk the ":latest" warning in RunPod's UI is
          # about.
